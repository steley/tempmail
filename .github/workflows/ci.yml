name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all sources
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Boot server and probe healthz + SMTP
        run: |
          SMTP_PORT=2525 PORT=3456 node src/server.js &
          echo $! > /tmp/tempmail.pid
          # wait for http
          for i in $(seq 1 20); do
            curl -fsS --noproxy '*' http://127.0.0.1:3456/healthz && break
            sleep 0.5
          done
          curl -fsS --noproxy '*' http://127.0.0.1:3456/healthz

          # probe SMTP banner (service must accept a connection on SMTP_PORT)
          exec 3<>/dev/tcp/127.0.0.1/2525
          head -1 <&3 | grep -q '^220' || (echo "SMTP banner missing" && exit 1)
          exec 3<&- 3>&-

          kill "$(cat /tmp/tempmail.pid)"

      - name: Websocket mailbox claim round-trip
        run: |
          SMTP_PORT=2526 PORT=3457 node src/server.js &
          echo $! > /tmp/tempmail2.pid
          sleep 1
          node scripts/smoke-socket.mjs
          rc=$?
          kill "$(cat /tmp/tempmail2.pid)"
          exit $rc

      - name: End-to-end SMTP delivery
        run: |
          SMTP_PORT=2527 PORT=3458 node src/server.js &
          echo $! > /tmp/tempmail3.pid
          for i in $(seq 1 20); do
            curl -fsS --noproxy '*' http://127.0.0.1:3458/healthz && break
            sleep 0.5
          done
          E2E_WEB_URL=http://127.0.0.1:3458 E2E_SMTP_PORT=2527 node scripts/e2e.mjs
          rc=$?
          kill "$(cat /tmp/tempmail3.pid)"
          exit $rc

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tempmail:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
