<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ink plate -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#1b1815"/>
  <!-- envelope body: warm paper -->
  <rect x="14" y="20" width="36" height="26" rx="4" fill="#f6f3ec"/>
  <!-- envelope flap: signal orange -->
  <path d="M15.5 22.5 L32 35 L48.5 22.5" fill="none" stroke="#d9480f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- temporal hint: clock, top-right -->
  <g transform="translate(47,17)">
    <circle r="10" fill="#d9480f"/>
    <circle r="6.2" fill="none" stroke="#f6f3ec" stroke-width="2.4"/>
    <path d="M 0 -3.2 L 0 0.4 L 3 0.4" fill="none" stroke="#f6f3ec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
